name: Release

# Tag a version (git tag v1.0.0 && git push --tags) to build installers,
# publish SHA256SUMS covering EVERY artifact (Windows + Linux), attach a
# GitHub build-provenance attestation, and create the GitHub Release.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write        # create the release
  id-token: write        # Sigstore OIDC — required for build provenance
  attestations: write    # write the attestation

jobs:
  linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash linux/build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip pyinstaller pikepdf
          choco install nsis -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Build installer
        shell: cmd
        run: windows\build_installer.bat
      # ---------------------------------------------------------------------
      # Code signing (SignPath Foundation — free for OSS). Disabled until the
      # project is approved and configured. See SIGNING.md, then set repo
      # variable SIGNPATH_ENABLED=true and add the SIGNPATH_* secrets/vars.
      # ---------------------------------------------------------------------
      # - name: Sign installer (SignPath)
      #   if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORG_ID }}
      #     project-slug: strix-metavault
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     github-artifact-id: ${{ steps.win_art.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: windows
      - name: Upload Windows artifact
        id: win_art
        uses: actions/upload-artifact@v4
        with:
          name: windows
          # Asset name must match the site's download link (data/downloads.js).
          path: windows/Strix-MetaVault-Setup.exe
          if-no-files-found: error

  release:
    name: Checksums, provenance & publish
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Flatten + generate SHA256SUMS (all platforms)
        run: |
          mkdir -p dist
          find staging -type f -exec cp -n {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"; cat SHA256SUMS
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/SBOM.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
