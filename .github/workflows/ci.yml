name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & build .deb (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime + test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libimage-exiftool-perl python3-tk
          python -m pip install --upgrade pip
          pip install pikepdf Pillow

      - name: Password-strength unit tests (pure)
        run: python tests/test_password_strength.py

      - name: Core end-to-end tests
        run: python tests/test_core.py

      - name: Static security scan (bandit)
        run: |
          pip install bandit
          bandit -q -r StrixMetaVault.py strix_metavault_core.py || true

      - name: Build .deb
        run: bash linux/build-deb.sh 0.0.0-ci

      - uses: actions/upload-artifact@v4
        with:
          name: strix-metavault-deb
          path: dist/*.deb
